[package]
name = "citrate-agent-metering"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Hermes metering (HUP-S7.5, runtime half): per-turn records derived from the agent-loop event stream, a JSONL log, a daily report (JSON + markdown), and an opt-in BenchmarkRegistry calldata builder (aggregates only; builds, never sends). Keyless: nothing here signs or talks to a chain."

[dependencies]
citrate-agent-loop = { path = "../agent-loop" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha3 = { workspace = true }
hex = "0.4"

[dev-dependencies]
tempfile = "3"
