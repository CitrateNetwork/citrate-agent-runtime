name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup SSH agent (deploy key for citrate-chain)
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.CHAIN_DEPLOY_KEY }}

      - name: Configure SSH host alias for citrate-chain
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          umask 077
          echo "${{ secrets.CHAIN_DEPLOY_KEY }}" > ~/.ssh/citrate-chain-readonly
          chmod 600 ~/.ssh/citrate-chain-readonly
          cat > ~/.ssh/config <<'SSHEOF'
          Host github-citrate-chain
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-chain-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libssl-dev pkg-config

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        continue-on-error: true

      - name: cargo test
        env:
          CARGO_INCREMENTAL: 0
        run: cargo test --workspace --locked

      # AR-B-046 — advisory sweep for the "absent/empty/unconfigured ⇒ permit"
      # idiom that was the shared root cause of AR-B-015/018/021/025/044. Every
      # hit is reviewed per instance (not auto-failed), so this step is
      # informational; flip SEMGREP_STRICT=1 in the runner to gate on it.
      - name: AR-B-046 fail-open-defaults tripwire (advisory)
        run: |
          python3 -m pip install --quiet semgrep || pipx install semgrep || true
          bash scripts/semgrep/run-ar-b-046.sh
        continue-on-error: true

  hic-terminology:
    name: HIC terminology guard (PBA-L8-018)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: HIC terminology in docs, UI strings, comments and descriptions
        run: |
          python3 scripts/check_hic_terminology.py --self-test
          python3 scripts/check_hic_terminology.py
