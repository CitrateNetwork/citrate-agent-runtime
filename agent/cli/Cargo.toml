[package]
name = "citrate-agent-cli"
version = "0.4.0"
edition = "2021"
description = "Citrate Agent CLI — `citrate-agent` binary. CIT-AGENT-7c lands the `doctor` subcommand; future slices add `daemon`, `step`, `install`, etc."
authors = ["Citrate Network"]
license = "MIT"
repository = "https://github.com/citrate-network/citrate"

[[bin]]
name = "citrate-agent"
path = "src/main.rs"

[dependencies]
citrate-agent-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
hex = "0.4"
