[package]
name = "citrate-agent-cli"
version = "0.4.0"
edition = "2021"
description = "Citrate Agent CLI — `citrate-agent` binary. CIT-AGENT-7c lands the `doctor` subcommand; future slices add `daemon`, `step`, `install`, etc."
authors = ["Citrate Network"]
license = "Apache-2.0"
repository = "https://github.com/CitrateNetwork/citrate-agent-runtime"

[[bin]]
name = "citrate-agent"
path = "src/main.rs"

[dependencies]
citrate-agent-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
hex = "0.4"
# `connect` — PKCE OAuth login + mint a memory connect token (no env vars).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
