[package]
name = "citrate-agent-core"
version = "0.4.0"
edition = "2021"
description = "Citrate Agent Core — RFC-CIT-AGENT-0001 normative library implementing the 8 subsystems (agent loop, policy engine, HITL queue, audit chain, capsule loader, model resolver, chain client, doctor). Consumed by Boeing shell + future agentd/cli/slint-embed/wasm surfaces."
authors = ["Citrate Network"]
license = "MIT"
repository = "https://github.com/citrate-network/citrate"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# RecorderClient (audit/) needs chain-client + signing primitives.
# Consumed from CitrateNetwork/citrate-chain via SSH deploy key during
# the federation transition. Swap to crates.io after chain's first
# audited release.
citrate-wallet-core = { git = "ssh://git@github.com/CitrateNetwork/citrate-chain", branch = "main" }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"
tracing = "0.1"

# ApprovalQueue (hitl/) needs the async + FIFO queue building blocks.
tokio = { version = "1", features = ["sync", "time", "rt"] }
serde_json = "1"

# CIT-AGENT-3a — capsule manifest schema + .cps archive read.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zstd = "0.13"
tar = "0.4"
sha2 = "0.10"
# CIT-AGENT-5a — canonical CBOR for audit-chain record encoding.
# RFC 8949 §4.2.1 deterministic encoding rules.
ciborium = "0.2"
base64 = "0.22"

# CIT-AGENT-3b — signature chain + WIT/WASM cross-check.
# ed25519 matches the native scheme used by citrate-wallet (workspace
# already pins 2.1). 3b's invariant-2 check is a pure-string scan of
# WIT imports (the linker's job is to enforce the static analysis at
# instantiation time).
ed25519-dalek = { version = "2.1", features = ["std"] }

# CIT-AGENT-3c — wasmtime engine + per-capsule linker.
# Pinned to wasmtime 26.x (current 2026 stable). The component-model
# feature is required for the WASM Component Model that capsules use.
# wasmtime-wasi provides the standard WASI host implementations we'll
# wire selectively per manifest in CIT-AGENT-3d.
wasmtime = { version = "26", features = ["component-model"] }
wasmtime-wasi = "26"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util", "macros"] }
# WAT → WASM at test time for the CIT-AGENT-3d component-instantiation
# tests. Pinned to a version aligned with wasmtime 26.
wat = "1.224"

# BFR-INT-wiremock-harness — JSON-RPC mock server for
# RecorderClient async-method tests. Drains AT-poam-A-3 + AT-vp-1.
wiremock = "0.6"
