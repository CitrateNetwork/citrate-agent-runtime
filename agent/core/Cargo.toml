[package]
name = "citrate-agent-core"
version = "0.4.0"
edition = "2021"
description = "Citrate Agent Core — RFC-CIT-AGENT-0001 normative library implementing the 8 subsystems (agent loop, policy engine, HITL queue, audit chain, capsule loader, model resolver, chain client, doctor). Consumed by Boeing shell + future agentd/cli/slint-embed/wasm surfaces."
authors = ["Citrate Network"]
license = "MIT"
repository = "https://github.com/citrate-network/citrate"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# AR-B-025: explicit, greppable opt-in that disables the authorized-signer
# roster (HITL quorum, break-glass, audit-chain role-sig verify). Previously
# this was implied by `cfg!(debug_assertions)`, which is true for ANY
# dev-profile build — including a debug *deployment* — so a `cargo run` or a
# `--profile dev` sidecar silently accepted self-minted keys. The runtime now
# gates on `cfg!(test)` (the crate's own unit-test build only) OR this explicit
# feature; a release/debug deployment fails closed unless this is set on purpose.
insecure-dev-hitl = []

[dependencies]
# RecorderClient (audit/) needs chain-client + signing primitives.
# Consumed from CitrateNetwork/citrate-chain via SSH deploy key during
# the federation transition. Swap to crates.io after chain's first
# audited release.
citrate-wallet-core = { git = "ssh://git@github-citrate-chain/CitrateNetwork/citrate-chain", rev = "0f2d16b486a9ec1ed8a0394440dac480075d6942" }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"
tracing = "0.1"

# ApprovalQueue (hitl/) needs the async + FIFO queue building blocks.
tokio = { version = "1", features = ["sync", "time", "rt"] }
serde_json = "1"

# CIT-AGENT-3a — capsule manifest schema + .cps archive read.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zstd = "0.13"
tar = "0.4"
sha2 = "0.10"
# CIT-AGENT-5a — canonical CBOR for audit-chain record encoding.
# RFC 8949 §4.2.1 deterministic encoding rules.
ciborium = "0.2"
base64 = "0.22"

# CIT-AGENT-3b — signature chain + WIT/WASM cross-check.
# ed25519 matches the native scheme used by citrate-wallet (workspace
# already pins 2.1). 3b's invariant-2 check is a pure-string scan of
# WIT imports (the linker's job is to enforce the static analysis at
# instantiation time).
ed25519-dalek = { version = "2.1", features = ["std"] }

# CIT-AGENT-3c — wasmtime engine + per-capsule linker.
# REM-12 (2026-05-23 sprint): bumped 26 → 45 to close the F-04 cluster.
# Per audit's per-repo F-04_FP_CHECK.md, the 26.x line was abandoned with
# no backport for RUSTSEC-2026-0091 (sandbox escape), 0093 (OOB read), or
# 0020 (resource exhaustion). The 36.0.7 / 42.0.2 / 43.0.1 / 45.0.0
# lines all carry the fix; chose 45.0.0 (latest stable) to future-proof
# for the next 6-12 months. See
# citrate-federation/agentile/sprints/active/2026-05-23-rem-12-wasmtime-bump.md.
#
# The component-model feature is required for the WASM Component Model
# that capsules use. wasmtime-wasi provides the standard WASI host
# implementations we wire selectively per manifest in CIT-AGENT-3d.
wasmtime = { version = "45", features = ["component-model"] }
wasmtime-wasi = "45"
# wasmtime-wasi-io is a peer crate of wasmtime-wasi that hosts the
# `wasi:io/error` binding. Required to wire io::error per-subsystem
# in linker.rs (the wasmtime-wasi internal HasIo marker is private,
# so we depend on the io crate directly). REM-12 wasmtime-26 → 45.
wasmtime-wasi-io = "45"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util", "macros"] }
# WAT → WASM at test time for the CIT-AGENT-3d component-instantiation
# tests. Bumped alongside wasmtime to maintain WAT parser compatibility
# with whatever component-model WAT syntax current wasmtime expects.
wat = "1"

# BFR-INT-wiremock-harness — JSON-RPC mock server for
# RecorderClient async-method tests. Drains AT-poam-A-3 + AT-vp-1.
wiremock = "0.6"
