[package]
name = "citrate-agent-chain"
version = "0.4.0"
edition = "2021"
description = "Native chain agent tools: check_balance, send_tx, deploy_contract, query_contract, list_models, run_inference, explain_tx"

[dependencies]
citrate-agent-core = { path = "../agent-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
