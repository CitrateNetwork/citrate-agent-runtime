[package]
license.workspace = true
# Renamed from citrate-agent-core in CIT-AGENT-1 (path: agent-core/ →
# agent-legacy/). The canonical citrate-agent-core now lives at
# agent/core/ per RFC-CIT-AGENT-0001 + planset
# .agentile/planset/2026-05-14-citrate-agent/01_CRATE_STRUCTURE.md.
#
# This crate stays as the Hermes-era agent infrastructure (approval/
# audit/tool/budget primitives) consumed by agent-chain, agent-code,
# agent-cron, citrate_desktop_app, citrate_gui_native. It migrates to
# the new crate via CIT-AGENT-8 (Boeing shell dep switch) and the
# dependent agent-* crates over CIT-AGENT-3..7.
name = "citrate-agent-legacy"
version = "0.4.0"
edition = "2021"
description = "Hermes-era agent primitives (approval / audit / tool / budget / delegation). Renamed from citrate-agent-core during CIT-AGENT-1 to free the canonical name for the RFC-CIT-AGENT-0001 implementation at agent/core/. Scheduled for migration in CIT-AGENT-3..8."

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID for tool execution IDs
uuid = { version = "1", features = ["v4"] }

# Audit finding CX-02: constant-time bearer-token comparison.
subtle = "2.5"

# RM-E5 / WP-E5.1 (audit AGT-06): wallet-signed capability grants.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }

# RM-E5 / WP-E5.5 (audit AGT-09): cancellation token for approval-timeout tasks.
tokio-util = { version = "0.7", features = ["rt"] }

# RM-E5 / WP-E5.7 (audit AGT-12): hex decode for Hermes signed events.
hex = "0.4"

# Optional: a batteries-included reqwest transport for the memory adapter
# (adapters::memory). OFF by default so the audited default build carries no HTTP
# client; consumers opt in with features = ["reqwest-transport"].
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

[features]
default = []
# Enables ReqwestMemoryTransport + MemoryAdapter::from_env() in adapters::memory.
reqwest-transport = ["dep:reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
