[package]
name = "citrate-agent-shell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Hermes's shell allowlist runner (HUP-S2.2): argv-only execution of allowlisted programs resolved from a fixed search path, scrubbed environment, caller-checked cwd, wall-clock timeout with process-group kill, capped output capture, and a RunReport for verifiers. Synchronous; run it on a blocking thread."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
