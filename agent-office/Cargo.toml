[package]
name = "citrate-agent-office"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Spreadsheet formats for the Hermes office tools (HUP-S10.2): bounded CSV and XLSX reading and writing over bytes. Path checks and file I/O stay with the caller (the sidecar checks every path against the member's folder grants). Keyless: nothing here signs."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
csv = "1.4"
calamine = "0.37"
rust_xlsxwriter = "0.101"
# Already in the tree through calamine and rust_xlsxwriter; named here to read the archive's
# central directory (declared sizes) before calamine inflates anything.
zip = { version = "9", default-features = false }
