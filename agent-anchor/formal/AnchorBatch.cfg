SPECIFICATION Spec
CONSTANTS
    MaxDay = 3
    MaxRecords = 4
    MaxPrune = 2
    MaxRewrite = 1
INVARIANTS
    TypeOK
    BatchedHaveValidProof
    ProofsSound
    RootCoversExactlyDay
    NoDoubleAnchor
    NoRebatchDifferentRoot
    IncompleteNeverAnchored
PROPERTIES
    EveryRecordEventuallyBatchedOrReported
CHECK_DEADLOCK FALSE
