SPECIFICATION Spec
CONSTANTS
    MaxDay = 4
    MaxRecords = 6
    MaxPrune = 3
    MaxRewrite = 2
INVARIANTS
    TypeOK
    BatchedHaveValidProof
    ProofsSound
    RootCoversExactlyDay
    NoDoubleAnchor
    NoRebatchDifferentRoot
    IncompleteNeverAnchored
PROPERTIES
    EveryRecordEventuallyBatchedOrReported
CHECK_DEADLOCK FALSE
