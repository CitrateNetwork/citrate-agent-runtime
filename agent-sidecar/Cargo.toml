[package]
name = "agent-sidecar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The citrate-core agent sidecar — a bearer-authed loopback HTTP control plane over the citrate-agent-core harness (capsule skills + the ceremony-grade ApprovalQueue + emergency-stop). citrate-core spawns this as the keyless agent that surfaces every chain effect for human approval. NOTE: distinct from hermes/ (the Discord bot) — different program."

[[bin]]
name = "citrate-agent-sidecar"
path = "src/main.rs"

[dependencies]
citrate-agent-core = { path = "../agent/core" }
citrate-agent-legacy = { path = "../agent-legacy" }
citrate-agent-loop = { path = "../agent-loop" }
citrate-agent-shell = { path = "../agent-shell" }
citrate-agent-guard = { path = "../agent-guard" }
citrate-agent-mcp-host = { path = "../agent-mcp-host" }
citrate-agent-learn = { path = "../agent-learn" }
citrate-agent-records = { path = "../agent-records" }
citrate-agent-grants = { path = "../agent-grants" }
citrate-agent-checkpoints = { path = "../agent-checkpoints" }
citrate-agent-office = { path = "../agent-office" }
citrate-agent-workers = { path = "../agent-workers" }
citrate-agent-metering = { path = "../agent-metering" }
citrate-agent-trajectory = { path = "../agent-trajectory" }
citrate-agent-anchor = { path = "../agent-anchor" }
hex = "0.4"
citrate-agent-escalation = { path = "../agent-escalation" }
citrate-agent-search = { path = "../agent-search" }
citrate-agent-browser = { path = "../agent-browser" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# HUP-S1.5 tests build an x402 receipt header (already in Cargo.lock).
base64 = "0.22"
citrate-agent-records = { path = "../agent-records" }
tempfile = "3"
tower = "0.5"
sha2 = "0.10"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
