# HGW-5 — the auto-approve list (D-16 as amended, owner decision 2026-10-15 HGW (3)).
#
# A `shell_run` command that matches one rule below runs WITHOUT an approval card, but only when
# ALL of these hold (checked in agent-sidecar/src/auto_approve.rs and shell_run.rs):
#   * the session has not read untrusted content (after taint every command asks, HGW-1);
#   * the OS sandbox is enforced for the run (no network; Seatbelt or bubblewrap);
#   * the folder it runs in is inside one of the session's project roots, and the run may write
#     only that project (not the wider folder grant);
#   * auto-approve is on (CITRATE_HERMES_AUTO_APPROVE is not `0`).
# Anything else (other programs or arguments, network, outside a project) still shows a card.
#
# Opt-in rules (owner decision 2026-11-16, V1 of the Hermes x FL gap analysis): a rule marked
# `opt_in = true` can run code the project itself defines, or that the project's own config can
# point at, so it is NOT approved by default. That covers `node <file>`, npm scripts (`npm run`,
# and `npm test` with its pre/post scripts), the project's own `tsc`, `cargo` (build.rs,
# proc-macros, test binaries), `forge` (a foundry.toml with `ffi = true`), and git commands other
# than `init` (a repository's config and .gitattributes can name filter, diff and textconv
# programs). It runs without a card only in a project the member turned it on for, one rule at a
# time, in citrate-core's Hermes settings; core sends that choice as `autoApproveOptIns` when it
# opens a session. Everywhere else these commands ask.
#
# The rules approved by default run no project-defined code, each for the reason on its rule.
#
# Rule fields:
#   id            stable name, recorded with every auto-approved run
#   program       the bare program name
#   subcommands   the first argument must be one of these (absent = no subcommand)
#   flags         flags allowed anywhere after the subcommand (exact match)
#   value_flags   flags that take a value (`-m msg` or `--message=msg`), with the value's kind
#   require_one_of  at least one of these flags must be present
#   operands      the kind of every non-flag argument: relative-path | script-name | pattern |
#                 name | none
#   operand_values  when present, every operand must be one of these exact values
#   min_operands / max_operands
#   opt_in        true = off unless the member turned this rule on for the project (see above)
# Value kinds: relative-path (no absolute path, no `..`, no `~`, no leading `-`), script-name
# ([A-Za-z0-9:._-], at most 64), name ([A-Za-z0-9_.-]), pattern and text (no NUL; pattern at most
# 256 bytes, no leading `-`; text at most 4096 bytes), count (digits).

version = 1

# Default: lists directory entries; runs nothing from the project.
[[rule]]
id = "ls"
program = "ls"
flags = ["-1", "-a", "-A", "-l", "-la", "-al", "-lh", "-lah", "-alh", "-R", "-F"]
operands = "relative-path"
max_operands = 16

# Default: prints the folder; reads nothing.
[[rule]]
id = "pwd"
program = "pwd"
operands = "none"

# Default: prints files; runs nothing from the project.
[[rule]]
id = "cat"
program = "cat"
flags = ["-n"]
operands = "relative-path"
min_operands = 1
max_operands = 16

# Default: prints the start of files; runs nothing from the project.
[[rule]]
id = "head"
program = "head"
value_flags = { "-n" = "count", "-c" = "count" }
operands = "relative-path"
min_operands = 1
max_operands = 16

# Default: prints the end of files; runs nothing from the project.
[[rule]]
id = "tail"
program = "tail"
value_flags = { "-n" = "count", "-c" = "count" }
operands = "relative-path"
min_operands = 1
max_operands = 16

# Default: counts lines, words and bytes; runs nothing from the project.
[[rule]]
id = "wc"
program = "wc"
flags = ["-l", "-w", "-c"]
operands = "relative-path"
min_operands = 1
max_operands = 16

[[rule]]
id = "node-script"
opt_in = true
program = "node"
operands = "relative-path"
min_operands = 1
max_operands = 1

[[rule]]
id = "npm-run"
opt_in = true
program = "npm"
subcommands = ["run", "run-script"]
flags = ["--silent", "-s"]
operands = "script-name"
operand_values = ["build", "test", "lint", "typecheck"]
min_operands = 1
max_operands = 1

[[rule]]
id = "npm-test"
opt_in = true
program = "npm"
subcommands = ["test", "t"]
flags = ["--silent", "-s"]
operands = "none"

[[rule]]
id = "npx-tsc"
opt_in = true
program = "npx"
subcommands = ["tsc"]
flags = ["--noEmit", "--pretty"]
value_flags = { "-p" = "relative-path", "--project" = "relative-path" }
operands = "none"

[[rule]]
id = "forge-build-test"
opt_in = true
program = "forge"
subcommands = ["build", "test"]
flags = ["--offline", "--force", "--json", "--summary", "--gas-report", "-vv", "-vvv", "-vvvv"]
value_flags = { "--match-test" = "pattern", "--mt" = "pattern", "--match-contract" = "pattern", "--mc" = "pattern" }
operands = "none"

[[rule]]
id = "cargo-offline"
opt_in = true
program = "cargo"
subcommands = ["build", "test", "check"]
require_one_of = ["--offline", "--frozen"]
flags = ["--offline", "--frozen", "--locked", "--release", "--all-targets", "--workspace", "--lib", "--bins", "--tests", "-q", "--quiet"]
value_flags = { "-p" = "name", "--package" = "name", "--test" = "name", "--bin" = "name" }
operands = "pattern"
max_operands = 1

# Default: creates an empty repository with the system template only (`--template` is refused,
# hooks are off); there is no repository config or attribute yet to name a program.
[[rule]]
id = "git-init"
program = "git"
subcommands = ["init"]
flags = ["-q", "--quiet"]
operands = "none"

[[rule]]
id = "git-status"
opt_in = true
program = "git"
subcommands = ["status"]
flags = ["-s", "--short", "-b", "--branch", "--porcelain"]
operands = "relative-path"
max_operands = 16

[[rule]]
id = "git-diff"
opt_in = true
program = "git"
subcommands = ["diff"]
flags = ["--stat", "--cached", "--staged", "--name-only", "--no-color"]
operands = "relative-path"
max_operands = 16

[[rule]]
id = "git-add"
opt_in = true
program = "git"
subcommands = ["add"]
flags = ["-A", "--all", "-u"]
operands = "relative-path"
max_operands = 64

[[rule]]
id = "git-commit"
opt_in = true
program = "git"
subcommands = ["commit"]
flags = ["-a", "--all", "-q", "--quiet"]
value_flags = { "-m" = "text", "--message" = "text" }
require_one_of = ["-m", "--message"]
operands = "none"
