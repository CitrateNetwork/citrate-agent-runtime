[package]
name = "citrate-agent-cron"
version = "0.4.0"
edition = "2021"
description = "Cron scheduling and Standard Operating Procedures (SOPs) for the Citrate agent system"

[dependencies]
# Legacy agent core (aliased) — needed by the existing
# SOPDefinition / ApprovalFlow infrastructure in sop.rs.
citrate-agent-core = { path = "../agent-legacy", package = "citrate-agent-legacy" }

# BFR-INT-poam-B — real agent-core for RecorderClient access in
# the tripwire jobs. Imported under a distinct name so the
# legacy `citrate_agent_core::*` imports keep working.
citrate-recorder = { path = "../agent/core", package = "citrate-agent-core" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

# BFR-INT-poam-B — HTTP for Prometheus + chain log queries
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"
sha3 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# BFR-INT-wiremock-harness — JSON-RPC mock for the fire() helper's
# revert + timeout paths. Drains the agent-cron tail of the
# verification-poll deferral.
wiremock = "0.6"

[[bin]]
name = "citrate-tripwire-daemon"
path = "src/bin/tripwire_daemon.rs"
