[package]
name = "citrate-agent-cron"
version = "0.1.0"
edition = "2021"
description = "Cron scheduling and Standard Operating Procedures (SOPs) for the Citrate agent system"

[dependencies]
citrate-agent-core = { path = "../agent-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
