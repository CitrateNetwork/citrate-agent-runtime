# hermes-discord — the serenity gateway adapter for Hermes (HERMES-L-S1, WP-S1.1/S1.2).
# Transport only: it normalizes Discord gateway events into hermes-core event types,
# asks the guard what to do, and carries out the resulting Action. It makes NO
# authorization or routing decisions of its own — those all live in hermes-core (ADR-H3).
[package]
name = "hermes-discord"
version = "0.4.0"
edition = "2021"
authors = ["Citrate Network"]
license = "MIT"
repository = "https://github.com/CitrateNetwork/citrate-agent-runtime"
description = "Hermes Discord gateway adapter + daemon: maps gateway events onto the hermes-core boundary (HERMES-L-S1)."

[[bin]]
name = "hermesd"
path = "src/bin/hermesd.rs"

[features]
# Off by default: pulls in the chain stack (citrate-agent-core → wasmtime, wallet-core)
# ONLY when on-chain decision anchoring is built in. Build the production daemon with
# `--features anchor` and set HERMES_DECISION_REGISTRY + a signer to anchor (WP-S2.2b).
default = []
anchor = ["dep:hermes-anchor"]

[dependencies]
hermes-core = { path = "../core" }
hermes-llm = { path = "../llm" }
hermes-anchor = { path = "../anchor", optional = true }
serenity = { version = "0.12", default-features = false, features = [
    "builder",
    "client",
    "gateway",
    "http",
    "model",
    "rustls_backend",
] }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
