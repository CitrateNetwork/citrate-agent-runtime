[package]
name = "citrate-agent-browser"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Hermes's browser worker (HUP-S5.1 + S5.6): drives a Chromium found on the system, or a managed one at a configured path, over the Chrome DevTools Protocol. Ref-indexed accessibility snapshots, act by ref, a screencast for the Browser pop-out, and attach-to-Chrome with per-origin consent (banking, email and health origins excluded by default). Page content is always untrusted. Keyless: never signs."

[dependencies]
citrate-agent-loop = { path = "../agent-loop" }
citrate-agent-guard = { path = "../agent-guard" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
url = "2"
tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
