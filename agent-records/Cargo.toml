[package]
name = "citrate-agent-records"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Local, append-only, hash-chained decision records for every HIC-1 / HIC-2 event (HUP-S2.6). JSONL segments with size-bounded rotation, a verifier that detects edits, reordering and truncation, write-ahead semantics with an outcome_unknown recovery state, a read API for the UI, and a daily RFC 6962 Merkle root with inclusion proofs for later anchoring. Keyless: nothing here signs."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
